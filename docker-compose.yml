services:
  postgres:
    image: postgres:16-alpine
    container_name: face-postgres
    environment:
      POSTGRES_DB: face_stream
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d face_stream"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@postgres:5432/face_stream
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: face-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
